# One command surface for people, agents and CI. CI files only call these tasks,
# so GitHub Actions and GitLab CI stay thin and interchangeable.
version: "3"

env:
  # Containers write into the bind-mounted repo as this user (see compose files).
  USER_ID: { sh: id -u }
  GROUP_ID: { sh: id -g }

vars:
  DC: docker compose -f compose.local.yml
  DC_CI: docker compose -f compose.local.yml -f compose.ci.yml
  RUN: docker compose -f compose.local.yml run --rm

tasks:
  default:
    cmds: [task --list]

  # ── Local development ────────────────────────────────────────────────────
  setup:
    desc: First run - env file, images, dependencies
    cmds:
      - task: env:local
      - task: dev:build
      - "{{.RUN}} frontend /app/docker/frontend/pnpm --version"

  env:local:
    desc: Create .envs/local/app.env (decrypt if possible, else copy the example)
    status: [test -f .envs/local/app.env]
    cmds:
      - |
        # Via a temp file: `> app.env` would truncate first and leave an empty file on failure.
        if [ -f .envs/local/app.env.enc ] && sops --decrypt --input-type dotenv --output-type dotenv \
             .envs/local/app.env.enc > .envs/local/app.env.tmp 2>/dev/null; then
          mv .envs/local/app.env.tmp .envs/local/app.env
          echo "decrypted .envs/local/app.env"
        else
          rm -f .envs/local/app.env.tmp
          cp .envs/local/app.env.example .envs/local/app.env
          echo "copied .envs/local/app.env from the example"
        fi

  dev:build:
    desc: Build the local images
    cmds: ["{{.DC}} build"]

  # Detached on purpose: the command returns once services are healthy, so it
  # works the same for people, agents and scripts. Logs: task dev:logs.
  dev:up:
    desc: Start the local stack in the background and wait until healthy (http://localhost:8000)
    deps: [env:local]
    cmds: ["{{.DC}} up -d --wait"]

  dev:down:
    desc: Stop the local stack (data volumes stay)
    cmds: ["{{.DC}} down"]

  dev:ps:
    desc: Show the state of the local services
    cmds: ["{{.DC}} ps"]

  dev:logs:
    desc: Follow logs, e.g. task dev:logs -- django
    cmds: ["{{.DC}} logs -f --tail=200 {{.CLI_ARGS}}"]

  dev:restart:
    desc: Recreate services so env file changes apply, e.g. task dev:restart -- django
    cmds: ["{{.DC}} up -d --wait --force-recreate {{.CLI_ARGS}}"]

  dev:reset:
    desc: Stop the stack and DELETE local data (database, node_modules volume)
    prompt: This deletes the local database and volumes. Continue?
    cmds: ["{{.DC}} down -v"]

  dev:manage:
    desc: Django management command, e.g. task dev:manage -- createsuperuser
    cmds: ["{{.RUN}} django python backend/manage.py {{.CLI_ARGS}}"]

  dev:makemigrations:
    desc: Create Django migrations (commit them)
    cmds: ["{{.RUN}} django python backend/manage.py makemigrations {{.CLI_ARGS}}"]

  # >>> realtime
  dev:alembic-revision:
    desc: Create an Alembic migration for realtime tables, e.g. task dev:alembic-revision -- "add x"
    cmds:
      - "{{.RUN}} realtime alembic -c realtime/alembic.ini revision --autogenerate -m {{.CLI_ARGS | shellQuote}}"
  # <<< realtime

  dev:seed-e2e:
    desc: Create the end-to-end test user
    cmds: ["{{.RUN}} django python backend/manage.py seed_e2e_user"]

  # ── Dependencies ─────────────────────────────────────────────────────────
  deps:lock:
    desc: Re-lock Python (uv.lock) and frontend (pnpm-lock.yaml) dependencies
    cmds:
      - uv lock
      - "{{.RUN}} frontend /app/docker/frontend/pnpm install --no-frozen-lockfile"

  deps:upgrade:
    desc: Upgrade all dependencies within their constraints; review the lockfile diff
    cmds:
      - uv lock --upgrade
      - "{{.RUN}} frontend /app/docker/frontend/pnpm update"

  # ── Docs ─────────────────────────────────────────────────────────────────
  docs:serve:
    desc: Serve the docs site with live reload at http://localhost:8888
    cmds: ["{{.DC}} --profile docs up docs"]

  # ── Checks (CI calls exactly these) ──────────────────────────────────────
  check:lint:
    desc: pre-commit hooks on all files (ruff, hygiene, secrets guard)
    cmds: ["uvx pre-commit run --all-files --show-diff-on-failure"]

  check:frontend:
    desc: Type-check, lint and unit-test the frontend
    cmds:
      - "{{.RUN}} --no-deps frontend /app/docker/frontend/pnpm run type-check"
      - "{{.RUN}} --no-deps frontend /app/docker/frontend/pnpm run ci:lint"
      - "{{.RUN}} --no-deps frontend /app/docker/frontend/pnpm run ci:test-unit"

  # mypy against mypy-baseline.txt: new errors fail, and so do fixed errors still
  # in the baseline. STACK=job (CI): in the commit's test image, on its /app code.
  check:types:
    desc: Python type check (mypy) against mypy-baseline.txt; STACK=job in CI
    vars:
      STACK: '{{.STACK | default "compose"}}'
    cmds:
      - cmd: "{{.RUN}} --no-deps django bash -c 'mypy | mypy-baseline filter --no-colors'"
        if: '{{ne .STACK "job"}}'
      - cmd: cd /app && mypy | mypy-baseline filter --no-colors --baseline-path "{{.ROOT_DIR}}/mypy-baseline.txt"
        if: '{{eq .STACK "job"}}'

  check:types:sync:
    desc: Rewrite mypy-baseline.txt from the current errors (after fixing some; on the merged tree)
    cmds: ["{{.RUN}} --no-deps django bash -c 'mypy | mypy-baseline sync'"]

  # The baseline may only shrink: compared with the merge base of BRANCH (on
  # BRANCH itself: the previous commit). ALLOW_GROWTH=1 for a deliberate case.
  check:types:baseline:
    desc: Fail when mypy-baseline.txt grew against BRANCH (default main)
    vars:
      BRANCH: '{{.BRANCH | default "main"}}'
    cmds:
      - |
        git fetch --quiet origin "{{.BRANCH}}" 2>/dev/null || true
        base="$(git merge-base HEAD "origin/{{.BRANCH}}" 2>/dev/null || true)"
        if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then base="HEAD~1"; fi
        before="$(git show "$base:mypy-baseline.txt" 2>/dev/null | grep -c . || true)"
        after="$(grep -c . mypy-baseline.txt || true)"
        echo "mypy baseline: ${before:-0} -> ${after:-0} errors (against $base)"
        if [ "${after:-0}" -gt "${before:-0}" ] && [ "{{.ALLOW_GROWTH}}" != 1 ]; then
          echo "the mypy baseline grew: fix the new errors instead (ALLOW_GROWTH=1 to accept)"; exit 1
        fi

  # One command, two runtimes. STACK=compose (default): through the dev stack.
  # STACK=job: directly in the current container, which CI sets to the commit's
  # test image (Postgres and Redis as job services, env from job variables);
  # runs the image's code in /app, not the checkout.
  test:backend:
    desc: Backend tests (migration check + pytest) against real Postgres and Redis; STACK=job in CI
    vars:
      STACK: '{{.STACK | default "compose"}}'
    cmds:
      - task: env:local
        if: '{{ne .STACK "job"}}'
      - cmd: "{{.RUN}} django python backend/manage.py makemigrations --check --dry-run"
        if: '{{ne .STACK "job"}}'
      - cmd: "{{.RUN}} django pytest {{.CLI_ARGS}}"
        if: '{{ne .STACK "job"}}'
      - cmd: cd /app && python backend/manage.py makemigrations --check --dry-run && pytest {{.CLI_ARGS}}
        if: '{{eq .STACK "job"}}'

  # STACK=compose (default): the dev stack with freshly built assets. STACK=job
  # (CI): the app runs as job services from the commit's images, by digest;
  # this container (the Playwright image) runs the proxy and the specs
  # (scripts/e2e_job.sh). Both go through the proxy, like production routing.
  test:e2e:
    desc: Playwright against the production-like stack through the proxy; STACK=job in CI
    vars:
      STACK: '{{.STACK | default "compose"}}'
    cmds:
      - task: env:local
        if: '{{ne .STACK "job"}}'
      - task: e2e:{{.STACK}}

  e2e:compose:
    internal: true
    cmds:
      - "{{.DC_CI}} --profile build run --rm frontend-build"
      - "{{.DC_CI}} up -d --wait django celeryworker proxy{{if .REALTIME}} realtime{{end}}"
      - defer: "{{.DC_CI}} down"
      - "{{.DC_CI}} --profile e2e run --rm playwright"
    vars:
      REALTIME: __REALTIME_ENABLED__

  e2e:job:
    internal: true
    cmds:
      - scripts/e2e_job.sh {{.CLI_ARGS}}

  check:docs:
    desc: Build the docs site strictly (broken links and nav entries fail)
    cmds: ["{{.DC}} --profile docs run --rm --no-deps docs build"]

  ci:
    desc: Everything CI runs before merge
    cmds:
      - task: check:lint
      - task: check:docs
      - task: check:frontend
      - task: check:types
      - task: test:backend
      - task: test:e2e

  # ── Secrets (SOPS + age) ─────────────────────────────────────────────────
  secrets:edit:
    desc: Edit an env in place, e.g. task secrets:edit ENV=production
    interactive: true
    requires: { vars: [ENV] }
    cmds:
      - sops --input-type dotenv --output-type dotenv .envs/{{.ENV}}/app.env.enc
      - task: secrets:examples

  secrets:encrypt:
    desc: Encrypt .envs/ENV/app.env into app.env.enc (commit the .enc)
    requires: { vars: [ENV] }
    cmds:
      # Via a temp file: a failed encrypt must not truncate the committed .enc.
      - sops --encrypt --input-type dotenv --output-type dotenv .envs/{{.ENV}}/app.env > .envs/{{.ENV}}/app.env.enc.tmp
      - mv .envs/{{.ENV}}/app.env.enc.tmp .envs/{{.ENV}}/app.env.enc

  secrets:decrypt:
    desc: Decrypt app.env.enc into the gitignored app.env
    requires: { vars: [ENV] }
    cmds:
      # Via a temp file: a failed decrypt must not leave an empty app.env.
      - sops --decrypt --input-type dotenv --output-type dotenv .envs/{{.ENV}}/app.env.enc > .envs/{{.ENV}}/app.env.tmp
      - mv .envs/{{.ENV}}/app.env.tmp .envs/{{.ENV}}/app.env

  secrets:updatekeys:
    desc: Re-encrypt for the recipients in .sops.yaml (after adding/removing a person)
    cmds:
      - for f in .envs/*/app.env.enc; do sops updatekeys --yes --input-type dotenv "$f"; done

  secrets:examples:
    desc: Regenerate app.env.example files from decrypted env files
    cmds: ["python3 scripts/env_examples.py"]

  # ── Release and deploy ───────────────────────────────────────────────────
  # Build once: CI builds each commit once (release:build-ci), tests that exact
  # image, marks it tested (release:mark-tested); a release copies the tested
  # digest to the version tag (release:promote). The version is the release tag,
  # never baked into an image. CI maps its own variables to the neutral ones
  # used here (REGISTRY, COMMIT, VERSION, CACHE_REF, REGISTRY_HOST/USER/PASSWORD);
  # nothing here knows the CI platform. Details: docs/operations.md.
  release:validate:
    desc: Check a release tag (shape __VERSION_EXAMPLE__, annotated, newer than the newest release; ALLOW_PRERELEASE=1 also takes prereleases)
    requires: { vars: [VERSION] }
    cmds: ["ALLOW_PRERELEASE={{.ALLOW_PRERELEASE | default 0}} scripts/release.sh validate {{.VERSION}}"]

  release:prepare:
    desc: Before tagging COMMIT as VERSION - shape, not taken, newer, contains the newest release; writes release-notes.md
    requires: { vars: [VERSION, COMMIT] }
    cmds: ["scripts/release.sh prepare {{.VERSION}} {{.COMMIT}}"]

  release:build-ci:
    desc: "CI: reuse the commit's tested images, else build the production and test images once, push by digest and record them in images.env"
    requires: { vars: [REGISTRY, COMMIT] }
    vars:
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
      # Integration branches take the tested build's cache when they reuse it.
      CACHE_RESTORE: '{{.CACHE_RESTORE | default "develop main"}}'
    env:
      IMAGE_BASE: "{{.REGISTRY | lower}}/__PROJECT__"
      COMMIT: "{{.COMMIT}}"
      CACHE_REF: "{{.CACHE_REF}}"
    cmds:
      - |
        rc=0; scripts/ci/tested_images.sh reuse images.env || rc=$?
        if [ "$rc" = 0 ]; then
          case " {{.CACHE_RESTORE}} " in
            *" {{.CACHE_REF}} "*) scripts/ci/tested_images.sh restore-cache "{{.CACHE_REF}}" || echo "cache not restored" ;;
          esac
          exit 0
        fi
        REGISTRY={{.REGISTRY | lower}} IMAGETAG={{.COMMIT}} GIT_SHA={{.COMMIT}} \
          CACHE_REF={{.CACHE_REF}} PLATFORMS={{.PLATFORMS}} \
          docker buildx bake --push --metadata-file build-metadata.json ci
        scripts/ci/tested_images.sh record build-metadata.json images.env
        scripts/ci/tested_images.sh record-cache images.env || echo "cache not recorded"

  release:check-image:
    desc: "CI: fail unless IMAGE (the job's image) is pinned to DIGEST"
    requires: { vars: [IMAGE, DIGEST] }
    cmds: ["scripts/ci/tested_images.sh check-image {{.IMAGE}} {{.DIGEST}}"]

  release:ran:
    desc: "CI: after a passing test job, write the digests it ran (DIGEST_*) to OUT"
    requires: { vars: [OUT] }
    cmds: ["scripts/ci/tested_images.sh ran {{.OUT}}"]

  release:mark-tested:
    desc: "CI: tag the recorded digests tested-<sha>, only if every ran-*.env names them; pin the build cache"
    requires: { vars: [REGISTRY, COMMIT] }
    env:
      IMAGE_BASE: "{{.REGISTRY | lower}}/__PROJECT__"
      COMMIT: "{{.COMMIT}}"
    cmds: ["scripts/ci/tested_images.sh mark ran-backend.env ran-e2e.env"]

  release:await-tested:
    desc: "Wait up to TIMEOUT s for tested-<sha>; copy ON_TESTED or (timeout) ON_UNTESTED to OUT"
    requires: { vars: [REGISTRY, COMMIT, OUT, ON_TESTED, ON_UNTESTED] }
    vars:
      TIMEOUT: '{{.TIMEOUT | default "1800"}}'
    env:
      IMAGE_BASE: "{{.REGISTRY | lower}}/__PROJECT__"
      COMMIT: "{{.COMMIT}}"
    cmds:
      - |
        rc=0; scripts/ci/tested_images.sh await {{.TIMEOUT}} || rc=$?
        case $rc in
          0) cp {{.ON_TESTED}} {{.OUT}} ;;
          3) echo "not tested in time: rebuild and test this commit first"; cp {{.ON_UNTESTED}} {{.OUT}} ;;
          *) exit "$rc" ;;
        esac

  release:promote:
    desc: Copy the tested images of COMMIT to the release tag VERSION, digest checked
    requires: { vars: [REGISTRY, COMMIT, VERSION] }
    env:
      IMAGE_BASE: "{{.REGISTRY | lower}}/__PROJECT__"
      COMMIT: "{{.COMMIT}}"
    cmds: ["scripts/ci/tested_images.sh promote {{.VERSION}}"]

  release:build:
    desc: Build and push production images tagged VERSION without the build-once path, e.g. task release:build REGISTRY=registry.example.com/acme VERSION=__VERSION_EXAMPLE__
    requires: { vars: [REGISTRY, VERSION] }
    vars:
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
      GIT_SHA: { sh: git rev-parse HEAD }
    cmds:
      # Image names must be lowercase; registry owners often are not.
      - REGISTRY={{.REGISTRY | lower}} IMAGETAG={{.VERSION}} GIT_SHA={{.GIT_SHA}} PLATFORMS={{.PLATFORMS}} docker buildx bake --push

  release:smoke:
    desc: Production smoke test - production images and settings behind a throwaway proxy. Local build, or pushed images with REGISTRY=... VERSION=<tag>
    cmds:
      - '{{if .VERSION}}REGISTRY={{.REGISTRY | lower}} VERSION={{.VERSION}} {{end}}scripts/smoke.sh'

  deploy:
    desc: Deploy a release - preflight, backup, pull, migrate (+ admin), up, verify. task deploy ENV=staging|production VERSION=__VERSION_EXAMPLE__ [ROLLBACK=1]
    requires: { vars: [ENV, VERSION] }
    # Inline on purpose: an exported DEPLOY_ENV in the shell must never win over ENV.
    vars:
      RUN: DEPLOY_ENV={{.ENV}} APP_VERSION={{.VERSION}} ROLLBACK={{.ROLLBACK | default "0"}} scripts/deploy.sh
    cmds:
      - "{{.RUN}} preflight"
      - "{{.RUN}} backup"
      - "{{.RUN}} pull"
      - "{{.RUN}} migrate"
      - "{{.RUN}} up"
      - "{{.RUN}} verify"

  deploy:*:
    desc: Any deploy.sh verb, e.g. task deploy:preflight ENV=production VERSION=__VERSION_EXAMPLE__, task deploy:admin ENV=production, task deploy:logs ENV=production -- django
    requires: { vars: [ENV] }
    vars:
      VERB: "{{index .MATCH 0}}"
    cmds: ["DEPLOY_ENV={{.ENV}} APP_VERSION={{.VERSION}} scripts/deploy.sh {{.VERB}} {{.CLI_ARGS}}"]
