# One deploy job, used by release.yml (staging, then production) and run by hand
# for a manual deploy or a rollback (an older version needs `rollback`: GitHub
# has no setting that blocks outdated deploy jobs, so the deploy script's guard
# does, and a manual run can pass the input). It checks out the release tag, so
# compose.deploy.yml matches the images whatever ref the run starts from.
# Each GitHub environment holds its own secrets (SOPS_AGE_KEY, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS) and protection rules (production: required reviewers).
# Thin wrapper: the logic is `task deploy` (scripts/deploy.sh).
name: deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      version: { type: string, required: true }
      rollback: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      version:
        description: Release to deploy (vX.Y.Z)
        type: string
        required: true
      rollback:
        description: Allow a version older than the one running
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Pinned CI tools (scripts/ci/tools.txt) come from TOOL_MIRROR_URL first, then
# from their original source; the SHA-256 is checked either way. The mirror is
# optional: any HTTP store with GET and PUT (scripts/ci/tools-lib.sh).
env:
  TOOL_MIRROR_URL: ${{ vars.TOOL_MIRROR_URL }}
  TOOL_MIRROR_HEADER: ${{ secrets.TOOL_MIRROR_HEADER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time; never cancel a running deploy.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
      # Compose equals the GitLab job image's; all three from scripts/ci/tools.txt
      - run: scripts/ci/install-tools.sh task docker-compose sops
      - run: task deploy ENV="$DEPLOY_ENV" VERSION="$VERSION" ROLLBACK="$ROLLBACK"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          ROLLBACK: ${{ inputs.rollback && '1' || '0' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
          # Pull access for the target host (ghcr.io: the workflow token)
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
