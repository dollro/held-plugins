# Thin wrapper: every step is a Task target, identical to what developers run.
# Pin third-party actions to a full commit SHA (with the version as a comment);
# Dependabot keeps the pins current (.github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: go-task/setup-task@v2
      - run: cp .envs/local/app.env.example .envs/local/app.env
      - run: task check:lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task check:docs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - run: task env:local
      - run: task check:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task test:backend -- --junitxml=backend-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-results
          path: backend-results.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
