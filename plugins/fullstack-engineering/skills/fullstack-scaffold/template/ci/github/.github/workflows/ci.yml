# Thin wrapper: every step is a Task target, identical to what developers run.
# Pin third-party actions to a full commit SHA (with the version as a comment);
# Dependabot keeps the pins current (.github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned CI tools (scripts/ci/tools.txt) come from TOOL_MIRROR_URL first, then
# from their original source; the SHA-256 is checked either way. The mirror is
# optional: any HTTP store with GET and PUT (scripts/ci/tools-lib.sh).
env:
  TOOL_MIRROR_URL: ${{ vars.TOOL_MIRROR_URL }}
  TOOL_MIRROR_HEADER: ${{ secrets.TOOL_MIRROR_HEADER }}

jobs:
  # Copies pinned CI tools the mirror lacks into it (scripts/ci/mirror-tools.sh),
  # so jobs survive an outage of the original download source. Only on main
  # (it writes) and only when a mirror is configured; never blocks the pipeline.
  mirror-tools:
    if: github.event_name == 'push' && vars.TOOL_MIRROR_URL != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/mirror-tools.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: scripts/ci/install-tools.sh task
      - run: cp .envs/local/app.env.example .envs/local/app.env
      - run: task check:lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task check:docs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - run: task env:local
      - run: task check:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task test:backend -- --junitxml=backend-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-results
          path: backend-results.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - uses: docker/setup-buildx-action@v4
      - run: task env:local
      - run: task test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # Production images and settings on every main commit: the release candidate.
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - uses: docker/setup-buildx-action@v4
      # Same Compose as the GitLab job image, from scripts/ci/tools.txt
      - run: scripts/ci/install-tools.sh docker-compose
      - run: task release:smoke
