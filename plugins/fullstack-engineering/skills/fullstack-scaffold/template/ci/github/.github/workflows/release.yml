# On a version tag: build and push production images tagged with the version.
# Deploying is a separate, deliberate step (deploy.yml) after the APP_VERSION bump.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      # Image names must be lowercase; GitHub owners often are not.
      - run: |
          registry="${REGISTRY:-ghcr.io/$OWNER}"
          task release:build REGISTRY="${registry,,}" VERSION="$VERSION"
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
