# Thin wrapper (logic in Taskfile.yml and scripts/, checked by scripts/check_ci.py).
# Release: annotated tag vX.Y.Z on main -> validate -> images -> smoke ->
# staging -> production. Production waits for the reviewers configured on the
# `production` environment (Settings > Environments). Protect the tag pattern
# `v*` with a ruleset so only maintainers create releases.
# Rollback or a manual deploy: run the deploy workflow (deploy.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Pinned CI tools (scripts/ci/tools.txt) come from TOOL_MIRROR_URL first, then
# from their original source; the SHA-256 is checked either way. The mirror is
# optional: any HTTP store with GET and PUT (scripts/ci/tools-lib.sh).
env:
  TOOL_MIRROR_URL: ${{ vars.TOOL_MIRROR_URL }}
  TOOL_MIRROR_HEADER: ${{ secrets.TOOL_MIRROR_HEADER }}
  # Where releases are pushed; the deploy preflight fails if a server pulls from elsewhere.
  RELEASE_REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci/install-tools.sh task
      - run: task release:validate VERSION="$GITHUB_REF_NAME"

  images:
    runs-on: ubuntu-latest
    needs: [validate]
    # Sized from measured cold builds; a stuck push fails instead of hanging.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - run: task release:build REGISTRY="$RELEASE_REGISTRY" VERSION="$GITHUB_REF_NAME"

  smoke:
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-tools.sh task
      # Same Compose as the GitLab job image, from scripts/ci/tools.txt
      - run: scripts/ci/install-tools.sh docker-compose
      - run: task release:smoke REGISTRY="$RELEASE_REGISTRY" VERSION="$GITHUB_REF_NAME"
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

  staging:
    needs: [smoke]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ github.ref_name }}
    secrets: inherit

  production:
    needs: [staging]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ github.ref_name }}
    secrets: inherit
