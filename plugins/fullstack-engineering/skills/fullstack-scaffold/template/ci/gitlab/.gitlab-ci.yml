# Thin wrapper: every job runs a Task target, identical to what developers run.
stages: [check, test, release, deploy]

variables:
  DOCKER_TLS_CERTDIR: "/certs"

.docker:
  image: docker:__DOCKER_VERSION__-cli
  services: ["docker:__DOCKER_VERSION__-dind"]
  before_script:
    - apk add --no-cache bash curl git python3
    - sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
    - task env:local

lint:
  stage: check
  image: ghcr.io/astral-sh/uv:python__PYTHON_VERSION__-__DEBIAN_SUITE__
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
    - sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
    - cp .envs/local/app.env.example .envs/local/app.env
  script:
    - task check:lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docs:
  stage: check
  extends: .docker
  script:
    - task check:docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend:
  stage: check
  extends: .docker
  script:
    - task check:frontend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend:
  stage: test
  extends: .docker
  script:
    - task test:backend -- --junitxml=backend-results.xml
  artifacts:
    when: always
    reports:
      junit: backend-results.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

e2e:
  stage: test
  extends: .docker
  needs: [backend]
  script:
    - task test:e2e
  artifacts:
    when: always
    paths: [frontend/playwright-report/]
    reports:
      junit: frontend/e2e-results.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

images:
  stage: release
  extends: .docker
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container
    - task release:build REGISTRY="${REGISTRY:-$CI_REGISTRY_IMAGE}" VERSION="$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Staging first, then the same pinned version on production. Each GitLab
# environment scopes its own SOPS_AGE_KEY, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
.deploy:
  stage: deploy
  extends: .docker
  before_script:
    - apk add --no-cache bash curl git openssh-client
    - sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
    - curl -fsSLo /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION:-v3.10.2}/sops-${SOPS_VERSION:-v3.10.2}.linux.amd64"
    - chmod +x /usr/local/bin/sops
    - eval "$(ssh-agent -s)" && chmod 600 "$DEPLOY_SSH_KEY" && ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && cat "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  variables:
    # Pull access for the target host: this job's registry token
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - task deploy ENV=$CI_ENVIRONMENT_NAME
    - task deploy:ps ENV=$CI_ENVIRONMENT_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:staging:
  extends: .deploy
  environment: staging

deploy:production:
  extends: .deploy
  environment: production
