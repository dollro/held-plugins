# Thin wrapper: every job runs a Task target, identical to what developers run.
# Logic lives in Taskfile.yml and scripts/; scripts/check_ci.py keeps it that way.
# Build once, release from main, and the project settings this relies on
# (protected tags, deploy variables, cleanup policy): docs/ci.md.
#   .gitlab/ci/common.yml      stages, variables, job templates
#   .gitlab/ci/build-test.yml  build once, test the digests, mark tested
#   .gitlab/ci/release.yml     create_release on main, the tag pipeline, deploy
#   .gitlab/ci/rebuild.yml     child of a tag pipeline whose commit is untested

include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/build-test.yml
  - local: .gitlab/ci/release.yml

# Branch and tag pipelines only: one pipeline per commit, so each commit is
# built once (merge request pipelines would build it a second time).
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

# Copies pinned CI tools the mirror lacks into it, so jobs survive an outage of
# the original download source. Integration branches and tags only (it writes);
# never blocks. The branches are named on purpose: CI_COMMIT_REF_PROTECTED is
# "false" on a develop that is not a protected branch, and the job never ran.
mirror-tools:
  stage: .pre
  image: docker:__DOCKER_VERSION__-cli
  interruptible: true
  allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - scripts/ci/mirror-tools.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# Checks on every branch commit. Interruptible: a newer commit cancels them.
.checks:
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH

lint:
  stage: check
  extends: .checks
  image: ghcr.io/astral-sh/uv:python__PYTHON_VERSION__-__DEBIAN_SUITE__
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    # Full history: the mypy baseline is compared with the merge base.
    GIT_DEPTH: "0"
  cache:
    key:
      files: [.pre-commit-config.yaml, uv.lock]
    paths: [.cache/pre-commit, .cache/uv]
  before_script:
    - export PATH="$BIN:$PATH"
    - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
    - scripts/ci/install-tools.sh task
  script:
    - cp .envs/local/app.env.example .envs/local/app.env
    - task check:lint
    - task check:types:baseline BRANCH="$CI_DEFAULT_BRANCH"
    - task test:scripts

# docs and frontend use the compose dev stack, like developers do (docs/ci.md).
docs:
  stage: check
  extends: [.docker, .checks]
  script:
    - task env:local
    - task check:docs

frontend:
  stage: check
  extends: [.docker, .checks]
  script:
    - task env:local
    - task check:frontend
