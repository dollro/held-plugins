# Child pipeline of a release tag whose commit has tested images: nothing to
# rebuild (a child pipeline needs at least one job). promote_tested in the tag
# pipeline copies them to the version tag.
already_tested:
  stage: test
  image: docker:__DOCKER_VERSION__-cli
  variables:
    GIT_STRATEGY: none
  script:
    - echo "tested-$CI_COMMIT_SHA exists, nothing to rebuild"
