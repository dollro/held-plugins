# Build once, test, mark tested. Included by .gitlab-ci.yml for branch
# pipelines and by child-rebuild.yml for the child pipeline a release tag starts
# when its commit has no tested images.
#
# Runner-location agnostic: no Docker socket, no host paths; per-commit tags
# and digests, so the runner's image cache only saves pulls and a cold runner on
# any host gets the same result.

.build-test:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_COMMIT_BRANCH

# The only image build of a pipeline. One bake run builds the production images
# and the test image (stage `test`, FROM the production django stage) and
# pushes them as <sha> / test-<sha>. The dotenv report images.env records the
# pushed digests (DIGEST_*), which the test jobs run and mark_tested tags, plus
# the cache refs this build wrote (CACHE_*). A commit with tested-<sha> already
# builds nothing: its tested digests are recorded instead, and develop/main
# take its pinned cache (release:build-ci).
build_images:
  stage: build
  extends: .docker
  interruptible: true
  # Sized from measured cold builds; a stuck push fails instead of hanging.
  timeout: 45m
  rules:
    # A release tag's rebuild child uses main's cache: a cache per tag is junk.
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      variables:
        CACHE_REF: main
    - if: $CI_COMMIT_BRANCH
      variables:
        CACHE_REF: $CI_COMMIT_REF_SLUG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container
    - task release:build-ci REGISTRY="$RELEASE_REGISTRY" COMMIT="$COMMIT" CACHE_REF="$CACHE_REF"
  artifacts:
    expire_in: 1 week
    # Task for the test job, whose image (non-root, no curl) cannot install it.
    paths: [.cache/bin/task]
    reports:
      dotenv: images.env

# Job image = the commit's test image, by digest (dotenv variables work in
# image: and services:). The tests run the image's code in /app, not the
# checkout (task test:backend STACK=job). Throwaway database credentials.
test_backend:
  stage: test
  extends: .build-test
  interruptible: true
  needs:
    - job: build_images
      artifacts: true
  image:
    name: $CI_REGISTRY_IMAGE/__PROJECT__-django@$DIGEST_DJANGO_TEST
    entrypoint: [""]
  services:
    - name: postgres:__POSTGRES_VERSION__
      alias: postgres
    - name: redis:__REDIS_VERSION__
      alias: redis
  variables:
    POSTGRES_DB: ci
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-only
    DATABASE_URL: postgres://ci:ci-only@postgres:5432/ci
    REDIS_URL: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: backend.config.settings.test
    DJANGO_SECRET_KEY: ci-only-not-secret
    INTERNAL_API_SECRET: ci-only-internal-secret
    EMAIL_URL: consolemail://
  before_script:
    - export PATH="$BIN:$PATH"
  script:
    # Fails unless this job runs the digest build_images recorded.
    - task release:check-image IMAGE="$CI_JOB_IMAGE" DIGEST="$DIGEST_DJANGO_TEST"
    - task test:backend STACK=job -- --junitxml="$CI_PROJECT_DIR/backend-results.xml"
    # Last: only a passing run writes the digests it ran (mark_tested checks).
    - task release:ran OUT=ran-backend.env
  artifacts:
    when: always
    expire_in: 1 day
    paths: [ran-backend.env]
    reports:
      junit: backend-results.xml

# The full stack from the commit's production images, by digest, behind the
# proxy (task test:e2e STACK=ci, compose.e2e.yml); Playwright runs the
# checkout's specs. Docker-in-Docker because the stack needs Celery, the proxy
# and Playwright side by side.
test_e2e:
  stage: test
  extends: [.docker, .build-test]
  interruptible: true
  timeout: 30m
  needs:
    - job: build_images
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - task env:local
    # >>> realtime
    - task test:e2e STACK=ci DJANGO_IMAGE="$CI_REGISTRY_IMAGE/__PROJECT__-django@$DIGEST_DJANGO" REALTIME_IMAGE="$CI_REGISTRY_IMAGE/__PROJECT__-realtime@$DIGEST_REALTIME"
    # <<< realtime
    # >>> !realtime
    - task test:e2e STACK=ci DJANGO_IMAGE="$CI_REGISTRY_IMAGE/__PROJECT__-django@$DIGEST_DJANGO"
    # <<< !realtime
    - task release:ran OUT=ran-e2e.env
  artifacts:
    when: always
    expire_in: 1 day
    paths: [ran-e2e.env, frontend/playwright-report/]
    reports:
      junit: frontend/e2e-results.xml

# Every test job passed on the recorded digests: tag exactly those tested-<sha>
# (test image: test-tested-<sha>) and pin the build's cache. Refuses when a
# ran-*.env names other digests: GitLab retries a job without its dependents,
# so a retried build would otherwise be marked on tests it never had. The
# checks of the same commit must be green too (absent in a rebuild child).
mark_tested:
  stage: mark
  extends: [.registry, .build-test]
  needs:
    - job: build_images
      artifacts: true
    - job: test_backend
      artifacts: true
    - job: test_e2e
      artifacts: true
    - job: lint
      artifacts: false
      optional: true
    - job: docs
      artifacts: false
      optional: true
    - job: frontend
      artifacts: false
      optional: true
  script:
    - task release:mark-tested REGISTRY="$RELEASE_REGISTRY" COMMIT="$COMMIT"

# Production images and settings on every main commit, on the tested digests:
# the release candidate. Same job image as the deploy (same Compose).
smoke:
  stage: verify
  extends: .docker
  interruptible: true
  timeout: 20m
  needs: [mark_tested]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - task release:smoke REGISTRY="$RELEASE_REGISTRY" VERSION="tested-$COMMIT"
