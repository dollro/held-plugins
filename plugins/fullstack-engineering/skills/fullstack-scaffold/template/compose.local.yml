# Local development stack. Start with `task dev:up`.
name: __PROJECT__

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: dev
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: __PROJECT__-app-dev
  env_file: .envs/local/app.env
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:__POSTGRES_VERSION__
    env_file: .envs/local/app.env
    volumes:
      # Mount the parent: from the 18 image on, PGDATA is /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:__REDIS_VERSION__
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # >>> accounts

  # Catches all outgoing mail in development (verification codes, password
  # resets): http://localhost:8025
  mailpit:
    image: axllent/mailpit:__MAILPIT_VERSION__
    ports:
      - "127.0.0.1:8025:8025"
  # <<< accounts

  # Project docs (MkDocs): task docs:serve -> http://localhost:8888
  docs:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: __PROJECT__-app-dev
    entrypoint: ["mkdocs"]
    command: ["serve"]
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8888:8888"
    profiles: ["docs"]

  # One origin for the browser, routed like production (see docker/proxy/Caddyfile).
  proxy:
    image: caddy:__CADDY_VERSION__
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      django:
        condition: service_healthy

  django:
    <<: *app
    command: /docker/start-django-dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  celeryworker:
    <<: *app
    command: /docker/start-celery-worker

  celerybeat:
    <<: *app
    command: /docker/start-celery-beat

  flower:
    <<: *app
    command: /docker/start-flower
    ports:
      - "127.0.0.1:5555:5555"

  # >>> realtime
  realtime:
    <<: *app
    command: /docker/start-realtime-dev
    depends_on:
      django:
        condition: service_healthy
  # <<< realtime

  frontend:
    image: node:__NODE_VERSION__-__DEBIAN_SUITE__-slim
    working_dir: /app/frontend
    command: /app/docker/frontend/pnpm dev
    init: true  # PID 1 that forwards signals, so `docker compose down` is instant
    environment:
      HOST_UID: ${USER_ID:-1000}
      HOST_GID: ${GROUP_ID:-1000}
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data: {}
  frontend_node_modules: {}
